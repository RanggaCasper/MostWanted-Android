# Builds the APK; for each v* tag, also publishes a release. Run by hand (Actions > Build > Run workflow), it only
# uploads the APK as an artifact. The recompiler needs default.xbe: ci/default.xbe.enc, decrypted with the XBE_KEY
# secret. To make it, from Git Bash at the repo root:
#   openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -in assets/default.xbe -out ci/default.xbe.enc -pass pass:<key>
#
# Secrets: XBE_KEY (the passphrase of ci/default.xbe.enc), KEYSTORE_BASE64 (the release .jks in base64),
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. Without the keystore the APK has a debug signature.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags and commits, for the list of changes since the previous release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android SDK packages
        shell: cmd
        run: call "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34" "ndk;%NDK_VERSION%" "cmake;%CMAKE_VERSION%" >nul

      - name: Decrypt default.xbe
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          if [ -z "$XBE_KEY" ]; then echo "::error::The XBE_KEY secret is missing"; exit 1; fi
          if [ ! -f ci/default.xbe.enc ]; then echo "::error::ci/default.xbe.enc is missing"; exit 1; fi
          mkdir -p assets
          # through a file: Git Bash rewrites an environment value that looks like a path (the key may start with /)
          # before a Windows program such as openssl sees it
          key="$RUNNER_TEMP/xbe.key"
          # no line ending: a key saved on Windows can carry a CR that the secret then keeps
          printf '%s' "$XBE_KEY" | tr -d '\r\n' > "$key"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          # the one supported image: anything else recompiles to a broken game
          sha=$(sha1sum assets/default.xbe | cut -d' ' -f1)
          echo "default.xbe SHA-1 $sha"
          if [ "$sha" != "f636a16af04171089f879a4bed646e185c734233" ]; then echo "::error::default.xbe is not the supported image"; exit 1; fi

      - name: Release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No release keystore: the APK has a debug signature"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "BLACK_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "BLACK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BLACK_KEY_ALIAS=$KEY_ALIAS"
            echo "BLACK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        run: |
          # a tag names the version; a run by hand is the commit's
          if [ "$RELEASE" = "true" ]; then name="${GITHUB_REF_NAME#v}"; else name="dev-${GITHUB_SHA::7}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "GRADLE_ARGS=-PversionCode=${{ github.run_number }} -PversionName=$name" >> "$GITHUB_ENV"

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Name the APK
        shell: bash
        run: mv app/build/outputs/apk/release/app-release.apk "MostWanted-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: MostWanted-${{ steps.version.outputs.name }}
          path: MostWanted-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Release notes
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          apk="MostWanted-${{ steps.version.outputs.name }}.apk"
          size=$(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f MB", b / 1048576 }')
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          sed -e "s|{{VERSION}}|$GITHUB_REF_NAME|g" -e "s|{{TAG}}|$GITHUB_REF_NAME|g" -e "s|{{APK}}|$apk|g" \
              -e "s|{{SIZE}}|$size|g" -e "s|{{SHA256}}|$sha|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
              ci/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          # the commits since the previous tag, which the app's update dialog shows too
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo
            echo "## What's Changed"
            echo
            git log --no-merges --pretty='* %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Most Wanted for Android ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: MostWanted-${{ steps.version.outputs.name }}.apk
          make_latest: true
