# Game repos sdk_sync works on. Copy to sdk_games.toml beside this file and edit; sdk_sync never compares that file.
# path: the game repo, relative to this file or absolute
# images: the XBEs it recompiles, checked in its assets folder
# names: words that mark a change as game specific
# harness: optional command printed after a downstream sync, run from the game repo

[[game]]
name = "SCDoubleAgent-V2Recomp"
path = "../../../SCDoubleAgent-V2Recomp"
images = ["default.xbe", "sc4_adv.xbe"]
names = ["SCDA", "Splinter Cell", "Double Agent", "sc4_adv", "SCDAOffline", "SCDAOnline"]
harness = "tests/harness/versus.sh generated/versus <game folder> <out folder> lobby"
