# not in the SDK's signatures: waits for idle, frees the frame buffers (0x378750) and makes them again (0x378880)
D3DDevice_Reset                                      = 0x374890
# stores [stage] at CDevice + 0xF98 (CDevice_Palettes) with the references the library keeps
D3DDevice_SetPalette                                 = 0x375340
# the title's raw pushes (0x0D1392, 0x0D6615): BeginPush flushes the lazy state (0x37B430) and makes room for
# count + 1 dwords, EndPush stores the end at CDevice + 0
D3DDevice_BeginPush                                  = 0x373E10
D3DDevice_EndPush                                    = 0x373E30
# copies a program (word count at +2) to the device's mirror at +0x10A8 + address * 16 and pushes NV097 0x1E9C/0x0B00
D3DDevice_LoadVertexShaderProgram                    = 0x373560
# the FIFO's get and put of the miniport (CDevice + 0x934) differ: the GPU is busy
D3DDevice_IsBusy                                     = 0x375460
# the sun's visibility test (0x0D5AB0): begin pushes NV097 0x17C8, end makes the report slot (0x3754C0) at
# CDevice + 0x7D4 and pushes 0x17D0, the result reads the slot the GPU would have written
D3DDevice_BeginVisibilityTest                        = 0x375490
D3DDevice_EndVisibilityTest                          = 0x375530
D3DDevice_GetVisibilityTestResult                    = 0x374620
